name: VELION Modular Fabric v2 - contract and security tests
on:
  push:
    branches: [main]
    paths:
      - 'src/velion_fabric/**'
      - 'tests/test_velion_fabric_v2.py'
      - '.github/workflows/velion-modular-fabric-ci.yml'
  pull_request:
    paths:
      - 'src/velion_fabric/**'
      - 'tests/test_velion_fabric_v2.py'
      - '.github/workflows/velion-modular-fabric-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modular-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python runtime
        run: python3 --version
      - name: Compile module contracts
        run: python3 -m compileall -q src/velion_fabric tests/test_velion_fabric_v2.py
      - name: Run v2 modular security suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_velion_fabric_v2.py' -v
