name: VELION — Bounded Private Model API Security
on:
  pull_request:
    paths:
      - 'scripts/velion_private_api.py'
      - 'tests/test_velion_private_api.py'
      - 'tests/test_velion_private_api_capacity.py'
      - 'src/velion_model_router.py'
      - '.github/workflows/velion-private-api-safety.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/velion_private_api.py'
      - 'tests/test_velion_private_api.py'
      - 'tests/test_velion_private_api_capacity.py'
      - 'src/velion_model_router.py'
      - '.github/workflows/velion-private-api-safety.yml'
permissions:
  contents: read
concurrency:
  group: velion-private-api-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check syntax of signed API and reviewed router
        run: python3 -m py_compile scripts/velion_private_api.py src/velion_model_router.py
      - name: Verify signed private API and overload protection offline
        run: python3 -m unittest discover -s tests -p 'test_velion_private_api*.py' -v
      - name: Verify model decision security offline
        run: python3 -m unittest discover -s tests -p 'test_velion_model_router.py' -v
