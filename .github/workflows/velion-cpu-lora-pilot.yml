name: VELION — bounded CPU LoRA research pilot
on:
  push:
    branches: [feat/velion-synthetic-intent-lab-20261030]
    paths:
      - 'training/intent_lab/lora_pilot.py'
      - 'training/intent_lab/lora_abstain_train.json'
      - '.github/workflows/velion-cpu-lora-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-lora-cpu:
    # Public repository, standard runner; no paid/larger runner or secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      DO_NOT_TRACK: '1'
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned direct research dependencies into ephemeral runner
        run: |
          python -m pip install --disable-pip-version-check --no-input 'torch==2.4.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-input 'numpy==1.26.4' 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1' 'safetensors==0.4.5'
      - name: Train and compare a tiny synthetic LoRA adapter
        run: python training/intent_lab/lora_pilot.py
