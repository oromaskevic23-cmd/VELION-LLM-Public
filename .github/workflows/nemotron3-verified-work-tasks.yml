name: VELION — Nemotron 3 Solve Three Verified Engineering Tasks

on:
  push:
    branches:
      - feat/velion-nemotron3-verified-work-tasks-20261028
    paths:
      - .github/workflows/nemotron3-verified-work-tasks.yml
      - scripts/nemotron3_work_tasks.py
      - tests/test_nemotron3_work_tasks.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nemotron3-solve-verified-work:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed code with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify scorer with offline tests before model download
        run: |
          python3 -m unittest discover -s tests -p test_nemotron3_cpu_probe.py -v
          python3 -m unittest discover -s tests -p test_nemotron3_work_tasks.py -v
          python3 -m unittest discover -s tests -p test_unique_in_order.py -v

      - name: Isolate official Ollama CPU service on localhost
        run: |
          docker pull ollama/ollama:latest
          docker run -d --name velion-work-tasks \
            --cpus=4 \
            --pids-limit=256 \
            -p 127.0.0.1:11434:11434 \
            -e OLLAMA_HOST=0.0.0.0:11434 \
            -e OLLAMA_NUM_PARALLEL=1 \
            -e OLLAMA_MAX_LOADED_MODELS=1 \
            -e OLLAMA_CONTEXT_LENGTH=3072 \
            ollama/ollama:latest
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null; then
              echo 'Ollama local runtime healthy'
              exit 0
            fi
            sleep 2
          done
          docker logs velion-work-tasks --tail 40
          exit 1

      - name: Install actual NVIDIA Nemotron 3 Nano 4B model on free CPU runner
        run: |
          curl --fail --show-error --silent --max-time 780 \
            -H 'Content-Type: application/json' \
            -X POST -d '{"model":"nemotron-3-nano:4b","stream":false}' \
            http://127.0.0.1:11434/api/pull > /tmp/nemotron3_work_pull.json
          python3 - <<'PY'
          import json
          receipt=json.load(open('/tmp/nemotron3_work_pull.json',encoding='utf-8'))
          assert receipt.get("status")=="success", "Official model download failed"
          print("PASS: NVIDIA Nemotron 3 Nano 4B installed on isolated local CPU")
          PY

      - name: Solve real engineering tasks with real model and independent verifier
        run: python3 scripts/nemotron3_work_tasks.py

      - name: Upload bounded evidence only — no weights or customer data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velion-nemotron3-verified-work-tasks
          path: artifacts/nemotron3/work_tasks_receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stop and remove temporary model service
        if: always()
        run: docker rm -f velion-work-tasks 2>/dev/null || true
