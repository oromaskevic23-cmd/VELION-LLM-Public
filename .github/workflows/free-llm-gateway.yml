name: VELEON Free Local LLM Gateway CI
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/free-llm-gateway.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without saving credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run bounded inference adapter unit tests with mocked local endpoint
        run: npm run verify
