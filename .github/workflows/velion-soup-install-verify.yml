name: VELION — Soup CLI Install and Trust Boundary
on:
  pull_request:
    paths:
      - '.github/workflows/velion-soup-install-verify.yml'
      - 'training/soup/**'
      - 'tests/test_soup_lab.py'
  push:
    branches: [main, feat/velion-soup-training-lab-20261029]
    paths:
      - '.github/workflows/velion-soup-install-verify.yml'
      - 'training/soup/**'
      - 'tests/test_soup_lab.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: velion-soup-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-core-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # trusted checkout v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check governance and opt-in safety without dependencies
        run: python -m unittest discover -s tests -p 'test_soup_lab.py' -v
      - name: Inspect host before installation
        run: python training/soup/soup_lab.py status
      - name: Install pinned light Soup CLI in an isolated venv
        run: python training/soup/soup_lab.py install --mode core
      - name: Verify actual installed version and help
        run: |
          training/soup/.venv/bin/python -c "from importlib.metadata import version; assert version('soup-cli') == '0.77.0'"
          training/soup/.venv/bin/soup --help > /tmp/velion-soup-help.txt
          test -s /tmp/velion-soup-help.txt
          echo "Verified pinned Soup CLI 0.77.0, no model download or training."
      - name: Record optional-stack diagnostic without claiming GPU readiness
        shell: bash
        run: |
          set +e
          training/soup/.venv/bin/soup doctor > /tmp/velion-soup-doctor.txt 2>&1
          rc=$?
          set -e
          tail -n 45 /tmp/velion-soup-doctor.txt
          echo "Doctor exit: $rc (missing optional training stack or GPU is not a CLI installation failure)"
          test -s /tmp/velion-soup-doctor.txt
