# One-time bounded real inference attempt: source-visible, zero credentials, no auto-retries.
# Owner / final architect: Alexander Nikolaevich Romaskevich (RomaskevicH).
name: VELION Nemotron 3.5 Bolt one-off CPU validation

on:
  push:
    branches: [feat/nemotron-bolt-e4b-eval-20261120]
    paths: [.github/workflows/velion-bolt-e4b-one-shot.yml]

permissions:
  contents: read

concurrency:
  group: velion-bolt-one-off
  cancel-in-progress: false

jobs:
  bounded-real-bolt-test:
    if: github.repository == 'oromaskevic23-cmd/VELION-LLM-Public' && github.event.head_commit.message == 'test(velion): one-shot Bolt E4B real CPU inference'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMPERIAL_CHAT_LOCAL_ONLY: 'YES'
      VELION_LOCAL_BACKEND: ollama
      VELION_LOCAL_MODEL: hf.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M
      VELION_BOLT_SMOKE_CONSENT: 'YES'
    steps:
      - name: Checkout without persisted tokens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Negative preflight checks before download
        run: |
          set -euo pipefail
          node --test apps/velion-chat/test/nemotron-bolt-preflight.test.mjs
          node --check apps/velion-chat/tools/nemotron-bolt-smoke.mjs
      - name: Prepare isolated local CPU-only model service
        run: |
          set -euo pipefail
          docker pull ollama/ollama:0.40.11
          docker run -d --name velion-bolt-e4b             --cpus=4 --memory=10g --pids-limit=256             -p 127.0.0.1:11434:11434             -e OLLAMA_HOST=0.0.0.0:11434             -e OLLAMA_NO_CLOUD=1             -e OLLAMA_NUM_PARALLEL=1             -e OLLAMA_MAX_LOADED_MODELS=1             -e OLLAMA_CONTEXT_LENGTH=2048             ollama/ollama:0.40.11
          for attempt in $(seq 1 50); do
            if curl --fail --silent --show-error http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
              echo "Ollama local CPU service ready"
              curl --fail --silent --show-error http://127.0.0.1:11434/api/version
              exit 0
            fi
            sleep 2
          done
          docker logs velion-bolt-e4b --tail 25
          exit 1
      - name: Download only one publicly licensed NVIDIA GGUF model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent --connect-timeout 15 --max-time 780             -H 'Content-Type: application/json'             -X POST -d '{"model":"hf.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M","stream":false}'             http://127.0.0.1:11434/api/pull > "$RUNNER_TEMP/bolt-pull.json"
          node --input-type=module -e '
            import{readFileSync}from"node:fs";
            const p=JSON.parse(readFileSync(process.argv[1],"utf8"));
            if(p.status!=="success")process.exit(1);
            console.log("BOLT_MODEL_PULL_CONFIRMED")
          ' "$RUNNER_TEMP/bolt-pull.json"
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/bolt-model-inventory.json"
      - name: Three actual source-visible VELION model probes
        shell: bash
        working-directory: apps/velion-chat
        run: |
          set +e
          node tools/nemotron-bolt-smoke.mjs > "$RUNNER_TEMP/bolt-smoke-report.json"
          rc=$?
          echo "BOLT_SMOKE_EXIT_CODE=$rc"
          if [[ -f "$RUNNER_TEMP/bolt-smoke-report.json" ]]; then
            cat "$RUNNER_TEMP/bolt-smoke-report.json"
          fi
          exit "$rc"
      - name: Keep bounded evidence, never GGUF weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: velion-bolt-e4b-once-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bolt-model-inventory.json
            ${{ runner.temp }}/bolt-smoke-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy temporary model container
        if: always()
        run: docker rm -f velion-bolt-e4b 2>/dev/null || true
