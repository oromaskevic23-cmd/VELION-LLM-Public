# Manual-scope one-time quality evidence: 20 synthetic prompts, no paid provider.
# Alexander Nikolaevich Romaskevich — Founder · Owner · CEO, Final Architectural Authority.
name: VELION Nemotron Bolt bounded 20-case evaluation
on:
  push:
    branches: [feat/nemotron-bolt-e4b-eval-20261120]
    paths: [.github/workflows/velion-bolt-intelligence-one-shot.yml]

permissions:
  contents: read

concurrency:
  group: velion-bolt-one-off
  cancel-in-progress: false

jobs:
  evaluate-cpu:
    if: >-
      github.repository == 'oromaskevic23-cmd/VELION-LLM-Public' && github.event.head_commit.message == 'test(velion): execute bounded Bolt 20-case evaluation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMPERIAL_CHAT_LOCAL_ONLY: 'YES'
      VELION_LOCAL_BACKEND: ollama
      VELION_LOCAL_MODEL: hf.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M
    steps:
      - name: Source checkout (no persisted GitHub credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify source and fail-closed preflight
        run: |
          set -euo pipefail
          node --test apps/velion-chat/test/nemotron-bolt-preflight.test.mjs
          node --check apps/velion-chat/tools/intelligence-suite.mjs
          node --check apps/velion-chat/tools/run-intelligence-suite.mjs
          node --check apps/velion-chat/chat-service.mjs
      - name: Start one CPU-only local Ollama container
        shell: bash
        run: |
          set -euo pipefail
          docker pull ollama/ollama:0.40.11
          docker run -d --name velion-bolt-quality \
            --cpus=4 --memory=10g --pids-limit=256 \
            -p 127.0.0.1:11434:11434 \
            -e OLLAMA_HOST=0.0.0.0:11434 -e OLLAMA_NO_CLOUD=1 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 \
            -e OLLAMA_CONTEXT_LENGTH=2048 \
            ollama/ollama:0.40.11
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install verified official NVIDIA weights once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent --connect-timeout 15 --max-time 780 \
            -H 'Content-Type: application/json' \
            -X POST -d '{"model":"hf.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB:Q4_K_M","stream":false}' \
            http://127.0.0.1:11434/api/pull > "$RUNNER_TEMP/bolt-quality-pull.json"
          node -e 'const f=require("fs");const p=JSON.parse(f.readFileSync(process.argv[1],"utf8"));if(p.status!=="success")process.exit(2);console.log("NVIDIA_BOLT_MODEL_PULL_CONFIRMED")' "$RUNNER_TEMP/bolt-quality-pull.json"
          curl --fail --silent http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/bolt-quality-inventory.json"
      - name: Evaluate 14 scored and 6 manual-review prompts against real local model
        working-directory: apps/velion-chat
        shell: bash
        run: |
          set -u
          export VELION_CHAT_TOKEN="$(openssl rand -hex 32)"
          rc=0
          node tools/run-intelligence-suite.mjs > "$RUNNER_TEMP/bolt-intelligence-report.json" || rc=$?
          unset VELION_CHAT_TOKEN
          if [[ -s "$RUNNER_TEMP/bolt-intelligence-report.json" ]]; then
            node -e 'const f=require("fs");const d=JSON.parse(f.readFileSync(process.argv[1],"utf8"));console.log(JSON.stringify({suite:d.suite,completed:d.completed,scoredPassed:d.scoredPassed,scoredTotal:d.scoredTotal,scoredAttempted:d.scoredAttempted,manualReview:d.manualReview,requestFailures:d.requestFailures,results:d.results.map(x=>({id:x.id,passed:x.passed,error:x.error??null,latencyMs:x.receipt?.latencyMs??null}))},null,2))' "$RUNNER_TEMP/bolt-intelligence-report.json" || rc=1
          else
            echo 'INFERENCE_REPORT_MISSING'
            rc=1
          fi
          exit "$rc"
      - name: Upload compact test receipts (not model weights)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: velion-bolt-quality-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bolt-quality-inventory.json
            ${{ runner.temp }}/bolt-intelligence-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Terminate local-only model container
        if: always()
        run: docker rm -f velion-bolt-quality 2>/dev/null || true
